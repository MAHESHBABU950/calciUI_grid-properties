<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="calci_ui.css">
    <link rel="shortcut icon" href="./calci_images.png" type="calci_images/x-icon">
</head>
<body>

    <div class="heading">
        <h1>Calculator UI using grid</h1>
    </div>

    <div class="calci">
        <div class="calciDisplay" id="calciItemDisplay">
            <p>1+10+100+1000</p>
        </div>
        <div class="calciItem" id="dig">
            <p>AC</p>
        </div>
        <div class="calciItem" id="dig">
            <p>+/-</p>
        </div>
        <div class="calciItem" id="dig">
            <p>%</p>
        </div>
        <div class="calciItem" id="orng">
            <p>/</p>
        </div>
        <div class="calciItem">
            <p>7</p>
        </div>
        <div class="calciItem">
            <p>8</p>
        </div>
        <div class="calciItem">
            <p>9</p>
        </div>
        <div class="calciItem" id="orng">
            <p>x</p>
        </div>
        <div class="calciItem">
            <p>4</p>
        </div>
        <div class="calciItem">
            <p>5</p>
        </div>
        <div class="calciItem">
            <p>6</p>
        </div>
        <div class="calciItem" id="orng">
            <p>-</p>
        </div>
        <div class="calciItem">
            <p>1</p>
        </div>
        <div class="calciItem">
            <p>2</p>
        </div>
        <div class="calciItem">
            <p>3</p>
        </div>
        <div class="calciItem" id="orng">
            <p>+</p>
        </div>
        <div class="calciMenu">
            <div class="menu"></div>
            <div class="menu"></div>
            <div class="menu"></div>
        </div>
        <div class="calciItem" id="zero">
            <p>0</p>
        </div>
        <div class="calciItem">
            <p>.</p>
        </div>
        <div class="calciItem" id="orng">
            <p>=</p>
        </div>
    </div>
</body>
</html>
